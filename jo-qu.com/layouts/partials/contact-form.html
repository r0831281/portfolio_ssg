{{ $d := index .Site.Data.consultancy .Lang }}
<section class="contact-form-panel" aria-labelledby="contact-form-title">
<h2 id="contact-form-title">{{ $d.formTitle }}</h2>
<p id="contact-required-note" class="form-note">{{ $d.formRequired }}</p>
<form class="contact-form" action="https://contact-forms.jonas-quintiens.workers.dev/submit/jo-qu" method="POST" aria-describedby="contact-required-note contact-data-note contact-delivery-note" data-sending="{{ $d.formSending }}" data-success="{{ $d.formSuccess }}" data-error="{{ $d.formError }}">
<div class="form-grid">
<div class="form-field"><label for="contact-name">{{ $d.formName }}</label><input id="contact-name" type="text" name="name" autocomplete="name" maxlength="120" required></div>
<div class="form-field"><label for="contact-email">{{ $d.formEmail }}</label><input id="contact-email" type="email" name="email" autocomplete="email" maxlength="254" required></div>
<div class="form-field"><label for="contact-message">{{ $d.formMessage }}</label><textarea id="contact-message" name="message" rows="6" maxlength="5000" required></textarea></div>
<input type="text" name="company" class="hidden-field" aria-hidden="true" tabindex="-1" autocomplete="off">
<p id="contact-data-note" class="form-note">{{ $d.contactHint }}</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAABfUZMRlWLiwVljr"></div>
<button type="submit" class="button">{{ $d.formSubmit }}</button>
<p id="contact-delivery-note" class="form-note">{{ $d.formDelivery }}</p>
<p class="contact-form-status" role="status" aria-live="polite"></p>
</div></form></section>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="{{ "js/contact-form.js" | relURL }}" defer></script>
